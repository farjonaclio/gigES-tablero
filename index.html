<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: cabecera de marca + pestañas; resumen primero (metas y cortes), detalle operativo después. */
:root{
  --ink:#1E2F42; --ink-2:#42566B; --muted:#6E8096;
  --bg:#EFF4F7; --surface:#FFFFFF; --sunk:#E6EDF2; --line:#D5DEE5; --line-soft:#E7EDF1;
  --accent:#00718A; --accent-soft:#E0F0F4; --accent-line:#9ECCD8;
  --s1:#007A99; --s2:#D6006A; --s3:#9A6F00;
  --good:#0E7A42; --good-soft:#E2F7EC; --warn:#A15C00; --warn-soft:#FFF1DC; --crit:#B42318; --crit-soft:#FDECEA;
  --verde:#1CE56D;
  --shadow:0 1px 2px rgba(30,47,66,.05), 0 10px 28px -18px rgba(30,47,66,.35);
  --display:"Questrial","Century Gothic",Verdana,sans-serif;
  --body:"Jost","Century Gothic",Verdana,sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#E9EFF5; --ink-2:#B8C7D5; --muted:#8797A8;
  --bg:#0E1822; --surface:#17222E; --sunk:#131D28; --line:#2B3B4B; --line-soft:#22303E;
  --accent:#45B8CE; --accent-soft:#0F2F39; --accent-line:#235A6B;
  --s1:#1C92AD; --s2:#E0428A; --s3:#B38718;
  --good:#71DA9F; --good-soft:#103526; --warn:#F2B35E; --warn-soft:#3A2A12; --crit:#FF8A80; --crit-soft:#3B1716;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -18px rgba(0,0,0,.75); color-scheme:dark }}
:root[data-theme="dark"]{
  --ink:#E9EFF5; --ink-2:#B8C7D5; --muted:#8797A8;
  --bg:#0E1822; --surface:#17222E; --sunk:#131D28; --line:#2B3B4B; --line-soft:#22303E;
  --accent:#45B8CE; --accent-soft:#0F2F39; --accent-line:#235A6B;
  --s1:#1C92AD; --s2:#E0428A; --s3:#B38718;
  --good:#71DA9F; --good-soft:#103526; --warn:#F2B35E; --warn-soft:#3A2A12; --crit:#FF8A80; --crit-soft:#3B1716;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -18px rgba(0,0,0,.75); color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:20px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:18px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand img{height:30px;width:auto;display:block}
.brand .neg{display:none}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .brand .col{display:none} :root:not([data-theme="light"]) .brand .neg{display:block} }
:root[data-theme="dark"] .brand .col{display:none} :root[data-theme="dark"] .brand .neg{display:block}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12.5px;color:var(--ink-2);background:var(--sunk);border-radius:99px;padding:4px 12px;white-space:nowrap}
.pill b{color:var(--ink);font-weight:500}
.pill.demo{background:var(--warn-soft);color:var(--warn)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.6vw,32px);line-height:1.15;margin:16px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:inherit;font-size:14px;color:var(--ink-2);background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main .wrap{padding-block:22px 60px;display:flex;flex-direction:column;gap:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 2px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.big{font-family:var(--display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--muted);font-family:var(--body)}
.meter{position:relative;height:10px;background:var(--sunk);border-radius:99px;margin:12px 0 6px;overflow:visible}
.meter i{display:block;height:100%;border-radius:99px}
.meter .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);border-radius:1px}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.row b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:99px;padding:3px 10px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{color:var(--good);background:var(--good-soft)} .warn{color:var(--warn);background:var(--warn-soft)} .crit{color:var(--crit);background:var(--crit-soft)}
.neutral{color:var(--ink-2);background:var(--sunk)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar2{display:flex;flex-direction:column;gap:3px;min-width:120px}
.bar2 span{display:block;height:6px;border-radius:0 4px 4px 0;min-width:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg text{fill:var(--muted);font-family:var(--body);font-size:12px}
.btn{font:inherit;font-size:13.5px;font-weight:500;border-radius:9px;padding:7px 13px;cursor:pointer;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:hover{filter:brightness(1.05)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:5px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.kpi3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:560px){.kpi3{grid-template-columns:1fr}}
.kpi3 div{background:var(--sunk);border-radius:10px;padding:12px}
.kpi3 .v{font-family:var(--display);font-size:26px;line-height:1.1}
.kpi3 .l{font-size:12.5px;color:var(--muted)}
form.cuali{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:820px){form.cuali{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
label.f input,label.f select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
label.f input:focus,label.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;box-shadow:var(--shadow);color:var(--ink)}
.note{font-size:12.5px;color:var(--muted)}
.viewswitch{display:flex;gap:4px;background:var(--sunk);border-radius:99px;padding:3px}
.viewswitch button{font:inherit;font-size:12.5px;border:0;background:none;color:var(--ink-2);border-radius:99px;padding:4px 11px;cursor:pointer}
.viewswitch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  var m='<span class="pill">Semana <b>S'+d.agg.semana+'</b></span><span class="pill">Actualizado <b>'+esc(fmtFecha(d.ultima))+'</b></span>';
  if(MODO==='publico' && state.ficticio) m='<span class="pill demo">Datos ficticios: el tablero aún no está conectado</span>'+m;
  if(MODO==='demo') m='<span class="pill demo">Datos ficticios de demostración</span>'+m+
    '<div class="viewswitch" role="group" aria-label="Vista"><button aria-pressed="'+(!cliente)+'" data-vista="interno">Vista CliO</button><button aria-pressed="'+cliente+'" data-vista="cliente">Vista cliente</button></div>';
  if(MODO==='interno') m+='<button class="btn" id="btn-sync">Sincronizar ahora</button>';
  document.getElementById('meta').innerHTML=m;
  document.getElementById('sub').textContent = cliente ? 'Avance de la encuesta y de las derivaciones · solo agregados; las celdas con menos de 5 casos se muestran como «<5».'
    : 'Encuesta a trabajadores, derivaciones y aplicaciones cualitativas · ES-T1341';
  var app=document.getElementById('app');
  if(state.tab==='resumen') app.innerHTML=vResumen(d.agg,cliente);
  if(state.tab==='cola') app.innerHTML=vCola(d.cola||[]);
  if(state.tab==='muestra') app.innerHTML=vMuestra(d.muestra||[]);
  if(state.tab==='cuali') app.innerHTML=vCuali(d.cuali||[]);
  bindTips();
}
var FR={lv:'lun–vie',sab:'sáb',dom:'dom',manana:'mañana',mediodia:'mediodía',tarde:'tarde',noche:'noche'};
function franja(s){return String(s).split(/[\s·]+/).filter(Boolean).map(function(x){return FR[x]||x;}).join(', ');}
function fmtFecha(s){var t=new Date(s);return isNaN(t)?s:t.toLocaleString('es-SV',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}

function corteDe(sem,cortes){for(var i=0;i<cortes.length;i++){if(sem<=cortes[i].s)return cortes[i];}return cortes[cortes.length-1];}
function semaforo(av,umbral){ if(av===null) return '<span class="chip neutral">Sin datos</span>';
  if(av>=umbral) return '<span class="chip ok">En meta del corte</span>';
  if(av>=umbral*0.8) return '<span class="chip warn">Cerca del umbral</span>';
  return '<span class="chip crit">Bajo el umbral: activar medidas</span>'; }

function grupoCard(g,p,corte,color,cliente){
  var av=pct(p.completas,p.meta), muj=pct(p.mujeres,p.con_sexo);
  var nombre = g==='T'?'Usuarios (tratamiento)':'Inscritos sin uso (comparación)';
  return '<div class="card"><div class="eyebrow">'+nombre+'</div>'+
    '<div class="big mono">'+num(p.completas)+' <small>de '+num(p.meta)+' encuestas</small></div>'+
    '<div class="meter" title="Umbral del corte: '+corte.umbral+'%"><i style="width:'+Math.min(100,av||0)+'%;background:'+color+'"></i><span class="mark" style="left:'+corte.umbral+'%"></span></div>'+
    '<div class="row"><span>Avance <b>'+(av===null?'—':av+'%')+'</b> · umbral corte S'+corte.s+': '+corte.umbral+'%</span>'+semaforo(av,corte.umbral)+'</div>'+
    '<div class="meter" style="margin-top:16px"><i style="width:'+(muj||0)+'%;background:'+color+';opacity:.55"></i><span class="mark" style="left:40%"></span></div>'+
    '<div class="row"><span>Mujeres <b>'+(muj===null?num(p.mujeres):muj+'%')+'</b> · mínimo 40%</span>'+
    (muj===null?'':(muj>=40?'<span class="chip ok">Cumple</span>':'<span class="chip crit">Priorizar mujeres</span>'))+'</div></div>';
}

function lineChart(serie){
  var W=1000,H=280,L=44,R=70,Tp=16,B=32, sMax=Math.max(9,serie[serie.length-1].s), sMin=4;
  var x=function(s){return L+(s-sMin)/(sMax-sMin)*(W-L-R);}, y=function(v){return Tp+(1-v/100)*(H-Tp-B);};
  var g='';
  [0,25,50,75,100].forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line-soft)"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'%</text>';});
  for(var s=sMin;s<=sMax;s++) g+='<text x="'+x(s)+'" y="'+(H-10)+'" text-anchor="middle">S'+s+'</text>';
  // umbrales de los cortes
  [[6,25],[7,50],[8,80],[9,100]].forEach(function(c){g+='<rect x="'+(x(c[0])-3)+'" y="'+(y(c[1])-1)+'" width="6" height="2" fill="var(--ink-2)"/>';});
  var series=[['T',700,'var(--s1)','Usuarios'],['C',600,'var(--s2)','Comparación']], lines='';
  series.forEach(function(sr){
    var pts=serie.map(function(p){return [x(p.s),y(Math.min(100,100*p[sr[0]]/sr[1])),p];});
    lines+='<polyline fill="none" stroke="'+sr[2]+'" stroke-width="2" stroke-linejoin="round" points="'+pts.map(function(p){return p[0]+','+p[1];}).join(' ')+'"/>';
    pts.forEach(function(p,i){ var last=i===pts.length-1;
      lines+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(last?5:3.5)+'" fill="'+sr[2]+'" stroke="var(--surface)" stroke-width="2" data-tip="'+sr[3]+' · S'+p[2].s+': '+p[2][sr[0]]+' encuestas ('+Math.round(100*p[2][sr[0]]/sr[1])+'% de '+sr[1]+')"/>';
      if(last) lines+='<text x="'+(p[0]+9)+'" y="'+(p[1]+4)+'" style="fill:var(--ink);font-weight:500">'+Math.round(100*p[2][sr[0]]/sr[1])+'%</text>';
    });
  });
  return '<div class="tw"><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Avance acumulado por semana, en porcentaje de la meta">'+g+lines+'</svg></div>';
}

function vResumen(a,cliente){
  var corte=corteDe(a.semana,a.cortes);
  var h='<div class="grid g2">'+grupoCard('T',a.porGrupo.T,corte,'var(--s1)',cliente)+grupoCard('C',a.porGrupo.C,corte,'var(--s2)',cliente)+'</div>';
  h+='<div class="card"><h2>Avance acumulado</h2><p class="hint">Porcentaje de la meta de cada grupo (700 y 600). Las marcas negras son los umbrales de los cortes semanales: 25% en S6, 50% en S7, 80% en S8 y cierre en S9.</p>'+
    '<div class="legend"><span><i style="background:var(--s1)"></i>Usuarios</span><span><i style="background:var(--s2)"></i>Comparación</span></div>'+lineChart(a.serie)+'</div>';
  // Por startup
  var maxv=1; a.startups.forEach(function(r){[r.T,r.C,r.refT,r.refC].forEach(function(v){if(typeof v==='number'&&v>maxv)maxv=v;});});
  var rows=a.startups.map(function(r){
    var bT=typeof r.T==='number'?r.T:0,bC=typeof r.C==='number'?r.C:0;
    return '<tr><td>'+esc(NOMBRES[r.st]||r.st)+'</td><td class="n">'+num(r.T)+'</td><td class="n note">'+(r.refT||'—')+'</td><td class="n">'+num(r.C)+'</td><td class="n note">'+(r.refC||'—')+'</td>'+
      '<td><div class="bar2"><span style="width:'+(100*bT/maxv)+'%;background:var(--s1)" data-tip="'+esc(NOMBRES[r.st])+' · usuarios: '+r.T+' (referencial '+r.refT+')"></span><span style="width:'+(100*bC/maxv)+'%;background:var(--s2)" data-tip="'+esc(NOMBRES[r.st])+' · comparación: '+r.C+(r.refC?' (referencial '+r.refC+')':'')+'"></span></div></td></tr>';
  }).join('');
  h+='<div class="card"><h2>Por solución</h2><p class="hint">Encuestas completas frente a la distribución referencial del Informe 1 (Tabla 7.2). La distribución por solución orienta el contacto; no es una cuota.</p>'+
    '<div class="tw"><table><thead><tr><th>Solución</th><th class="n">Usuarios</th><th class="n">Ref.</th><th class="n">Comparación</th><th class="n">Ref.</th><th>Avance</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  // Modo y derivación
  var mo=a.modos, tot=[mo.web,mo.telefono,mo.presencial].reduce(function(s,v){return s+(typeof v==='number'?v:0);},0)||1;
  var mb=[['Web','web','var(--s1)'],['Teléfono','telefono','var(--s2)'],['Presencial','presencial','var(--s3)']].map(function(x){
    var v=mo[x[1]],w=typeof v==='number'?100*v/tot:0;
    return '<div><div class="row"><span>'+x[0]+'</span><b>'+num(v)+(typeof v==='number'?' · '+Math.round(w)+'%':'')+'</b></div><div class="meter"><i style="width:'+w+'%;background:'+x[2]+'"></i></div></div>';
  }).join('');
  var dv=a.deriv, en48=pct(dv.atendidas_48,dv.con_primer);
  h+='<div class="grid g2"><div class="card"><h2>Modo de aplicación</h2><p class="hint">Encuestas completas según el medio. El presencial tiene un techo de 25% de la muestra.</p>'+mb+
    '<p class="note">Presencial sobre la meta total de 1.300: <b>'+(typeof mo.presencial==='number'?Math.round(100*mo.presencial/1300)+'%':num(mo.presencial))+'</b> (techo 25%).</p></div>'+
    '<div class="card"><h2>Derivaciones</h2><p class="hint">Casos que pasaron a teléfono o presencial: por solicitud de la persona, por 3 días sin respuesta web (ruta A) o por otro canal.</p>'+
    '<div class="kpi3"><div><div class="v mono">'+num(dv.solicitudes)+'</div><div class="l">pidieron otro medio</div></div><div><div class="v mono">'+num(dv.saliente)+'</div><div class="l">sin respuesta web</div></div><div><div class="v mono">'+num(dv.aplicadas)+'</div><div class="l">ya aplicadas</div></div></div>'+
    '<div class="row" style="margin-top:14px"><span>Primer intento en 48 h hábiles <b>'+(en48===null?num(dv.atendidas_48):en48+'%')+'</b></span>'+(en48===null?'':(en48>=90?'<span class="chip ok">En plazo</span>':'<span class="chip warn">Revisar tiempos</span>'))+'</div>'+
    '<div class="row"><span>Abiertas <b>'+num(dv.abiertas)+'</b> · cerradas sin aplicar <b>'+num(dv.cerradas)+'</b></span>'+(cliente?'':(dv.vencidas>0?'<span class="chip crit">'+dv.vencidas+' fuera de plazo</span>':'<span class="chip ok">Sin atrasos</span>'))+'</div>'+
    '<p class="note">Autorizan ser invitadas a la fase cualitativa: <b>'+num(a.autoriza_cuali)+'</b> personas.</p></div></div>';
  return h;
}

function vCola(cola){
  var f=state.filtro, list=cola.filter(function(k){
    if(f==='vencidos')return k.sla_vencido; if(f==='telefono')return k.medio==='telefono'; if(f==='presencial')return k.medio==='presencial'; if(f==='citadas')return k.estado==='citada'; return true;});
  list.sort(function(a,b){return (b.sla_vencido-a.sla_vencido)||((b.horas_sla||0)-(a.horas_sla||0));});
  var fl=[['todos','Todos ('+cola.length+')'],['vencidos','Fuera de plazo ('+cola.filter(function(k){return k.sla_vencido;}).length+')'],['telefono','Teléfono'],['presencial','Presencial'],['citadas','Citas']]
    .map(function(x){return '<button data-filtro="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>';}).join('');
  var rows=list.map(function(k){var e=ESTADOS[k.estado]||[k.estado,'neutral'];
    return '<tr><td class="mono"><b>'+esc(k.id)+'</b><div class="note">'+esc(NOMBRES[k.startup]||k.startup)+' · '+(k.grupo==='C'?'comparación':(k.grupo==='T'?'usuario':'por definir'))+'</div></td>'+
      '<td>'+esc(ORIGEN[k.origen]||k.origen)+'<div class="note">'+(k.medio==='presencial'?'Presencial':'Teléfono')+(k.franja?' · '+esc(franja(k.franja)):'')+'</div></td>'+
      '<td><span class="chip '+e[1]+'">'+e[0]+'</span></td>'+
      '<td class="n">'+(k.sla_vencido?'<span class="chip crit">'+k.horas_sla+' h</span>':esc(k.horas_sla)+' h')+'</td>'+
      '<td class="n">'+k.intentos+'</td><td>'+esc(k.proxima_accion)+'</td><td class="mono">'+esc(k.tel)+'</td>'+
      '<td><div class="acts"><a class="btn primary" target="_blank" rel="noopener" href="'+esc(k.link_aplicar)+'">Aplicar</a><a class="btn" target="_blank" rel="noopener" href="'+esc(k.link_registrar)+'">Registrar</a></div></td></tr>';
  }).join('');
  return '<div class="card"><h2>Cola de contacto</h2><p class="hint">Casos derivados a teléfono o presencial. <b>Aplicar</b> abre la misma encuesta con el caso precargado. <b>Registrar</b> abre el formulario de gestión para anotar el intento, la cita o el cierre. El caso se cierra solo cuando llega la encuesta.</p>'+
    '<div class="filters" role="group" aria-label="Filtrar la cola">'+fl+'</div>'+
    '<div class="tw"><table><thead><tr><th>Caso</th><th>Origen y medio</th><th>Estado</th><th class="n">Horas hábiles</th><th class="n">Intentos</th><th>Próxima acción</th><th>Teléfono</th><th></th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="8" class="note">No hay casos con este filtro.</td></tr>')+'</tbody></table></div>'+
    '<p class="note">Plazo: primer intento dentro de 48 horas hábiles; máximo 6 intentos. Quien pide no ser contactado se cierra el mismo día. Los teléfonos solo se ven en esta vista interna.</p></div>';
}

function vMuestra(m){
  var rows=m.map(function(r){var p=r.enviados?Math.round(100*r.completas/r.enviados):0;
    return '<tr><td>'+esc(NOMBRES[r.st]||r.st)+'</td><td class="n">'+num(r.casos)+'</td><td class="n">'+num(r.enlace)+'</td><td class="n">'+num(r.enviados)+'</td><td class="n">'+num(r.completas)+'</td><td class="n">'+p+'%</td></tr>';}).join('');
  return '<div class="card"><h2>Muestra y envíos (ruta A)</h2><p class="hint">Casos entregados por las startups que tienen base. La ruta B (difusión por QR) no aparece aquí porque no tenemos la lista de destinatarios.</p>'+
    '<div class="tw"><table><thead><tr><th>Solución</th><th class="n">Casos</th><th class="n">Con enlace</th><th class="n">Enviados</th><th class="n">Completas</th><th class="n">Respuesta</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+
    '<div class="grid g3">'+
    '<div class="card"><h2>1 · Generar enlaces</h2><p class="hint">Escribe en la planilla el enlace personal de cada caso, con su código precargado.</p><button class="btn primary" data-act="enlaces">Generar enlaces</button></div>'+
    '<div class="card"><h2>2 · Marcar envío</h2><p class="hint">Registra la fecha de envío de una ola. Desde esa fecha corren los 3 días antes de la llamada saliente.</p><label class="f">Ola<input id="ola" value="1" inputmode="numeric"></label><p></p><button class="btn" data-act="envio">Marcar envío de hoy</button></div>'+
    '<div class="card"><h2>3 · Activar presencial</h2><p class="hint">Cuando un corte lo pide y CASATIC lo aprueba: habilita la opción presencial para una solución y un grupo.</p>'+
    '<label class="f">Solución<select id="pres-st">'+Object.keys(NOMBRES).map(function(k){return '<option value="'+k+'">'+NOMBRES[k]+'</option>';}).join('')+'</select></label><p></p>'+
    '<label class="f">Grupo<select id="pres-g"><option value="T">Usuarios</option><option value="C">Comparación</option></select></label><p></p><button class="btn" data-act="pres">Activar</button></div></div>';
}

function vCuali(c){
  var cuenta={};c.forEach(function(r){cuenta[r.instrumento]=(cuenta[r.instrumento]||0)+(r.estado==='programada'?0:1);});
  var metas=Object.keys(METAS_CUALI).map(function(k){var v=cuenta[k]||0,w=Math.min(100,100*v/METAS_CUALI[k]);
    return '<div><div class="row"><span>'+PAUTAS[k]+'</span><b>'+v+' de '+METAS_CUALI[k]+'</b></div><div class="meter"><i style="width:'+w+'%;background:var(--accent)"></i></div></div>';}).join('');
  var rows=c.slice().reverse().map(function(r){var e={programada:'neutral',realizada:'ok',transcrita:'ok'}[r.estado]||'neutral';
    return '<tr><td class="mono">'+esc(r.id_app)+'</td><td>'+esc(PAUTAS[r.instrumento]||r.instrumento)+'</td><td class="mono">'+esc(r.codigo)+'</td><td>'+esc(r.fecha)+'</td><td>'+esc(r.modalidad)+'</td><td><span class="chip '+e+'">'+esc(r.estado)+'</span></td><td><a class="btn" target="_blank" rel="noopener" href="'+esc(r.doc_url)+'">Notas</a></td></tr>';}).join('');
  return '<div class="grid g2"><div class="card"><h2>Avance cualitativo</h2><p class="hint">Aplicaciones realizadas frente a lo previsto en el Informe 1 (Tabla 7.3): 22 entrevistas y 8 grupos focales.</p>'+metas+'</div>'+
    '<div class="card"><h2>Nueva aplicación</h2><p class="hint">Crea el registro y un documento de notas en la carpeta del proyecto en Drive. Use un código seudónimo, nunca el nombre de la persona.</p>'+
    '<form class="cuali" id="f-cuali"><label class="f">Instrumento<select id="c-inst">'+Object.keys(PAUTAS).map(function(k){return '<option value="'+k+'">'+k+' · '+PAUTAS[k]+'</option>';}).join('')+'</select></label>'+
    '<label class="f">Código del informante<input id="c-cod" placeholder="E3-QXM-01" required></label>'+
    '<label class="f">Tipo de informante<input id="c-inf" placeholder="Fundador/a, gerente…"></label>'+
    '<label class="f">Fecha<input id="c-fecha" type="date"></label>'+
    '<label class="f">Modalidad<select id="c-mod"><option>virtual</option><option>presencial</option></select></label>'+
    '<label class="f">Responsable<input id="c-resp" placeholder="Iniciales"></label>'+
    '<div><button class="btn primary" type="submit">Crear aplicación y notas</button></div></form></div></div>'+
    '<div class="card"><h2>Aplicaciones</h2><div class="tw"><table><thead><tr><th>Código</th><th>Instrumento</th><th>Informante</th><th>Fecha</th><th>Modalidad</th><th>Estado</th><th></th></tr></thead><tbody>'+
    (rows||'<tr><td colspan="7" class="note">Aún no hay aplicaciones registradas.</td></tr>')+'</tbody></table></div></div>';
}

// ---------------- EVENTOS ----------------
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-vista],[data-filtro],[data-act],#btn-sync'); if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;render();}
  else if(t.dataset.vista){state.vista=t.dataset.vista;render();}
  else if(t.dataset.filtro){state.filtro=t.dataset.filtro;render();}
  else if(t.id==='btn-sync'){call('sincronizar',[],function(){cargar();});}
  else if(t.dataset.act==='enlaces'){call('generarEnlaces',[]);}
  else if(t.dataset.act==='envio'){call('marcarEnvio',[document.getElementById('ola').value]);}
  else if(t.dataset.act==='pres'){call('activarPresencial',[document.getElementById('pres-st').value,document.getElementById('pres-g').value]);}
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='f-cuali')return; e.preventDefault();
  var a={instrumento:val('c-inst'),codigo:val('c-cod'),informante:val('c-inf'),fecha:val('c-fecha'),modalidad:val('c-mod'),responsable:val('c-resp')};
  call('crearAplicacionCuali',[a],function(r){cargar(); if(r&&r.url) toast('Creada: '+r.id);});
});
function val(id){return document.getElementById(id).value;}
function bindTips(){
  var tip=document.getElementById('tip');
  document.querySelectorAll('[data-tip]').forEach(function(el){
    el.addEventListener('mouseenter',function(ev){tip.textContent=el.getAttribute('data-tip');tip.hidden=false;});
    el.addEventListener('mousemove',function(ev){tip.style.left=Math.min(ev.clientX+12,window.innerWidth-240)+'px';tip.style.top=(ev.clientY+12)+'px';});
    el.addEventListener('mouseleave',function(){tip.hidden=true;});
  });
}
cargar();
})();
</script>

</body></html>
