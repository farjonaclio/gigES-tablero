<style>
/* Layout: cabecera de marca + pestañas; resumen primero (metas y cortes), detalle operativo después. */
:root{
  --ink:#1E2F42; --ink-2:#42566B; --muted:#5A6472;
  --bg:#F3F8E8; --surface:#FFFFFF; --sunk:#EEF3E4; --line:#D9DDE3; --line-soft:#E7EBEF;
  --accent:#00718A; --accent-soft:#E0F0F4; --accent-line:#9ECCD8;
  --s1:#1E2F42; --s2:#00718A; --s3:#FF0068;
  --good:#0E7A42; --good-soft:#E2F7EC; --warn:#A15C00; --warn-soft:#FFF1DC; --crit:#B42318; --crit-soft:#FDECEA;
  --verde:#1CE56D;
  --shadow:0 1px 2px rgba(30,47,66,.05), 0 10px 28px -18px rgba(30,47,66,.35);
  --display:"Century Gothic","Questrial","Didact Gothic",sans-serif;
  --body:"Century Gothic","Questrial","Didact Gothic",sans-serif;
  --clio-azul:#1E2F42; --clio-teal:#00718A; --clio-magenta:#FF0068; --clio-verde:#1CE56D; --clio-crema:#F3F8E8;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ink:#E9EFF5; --ink-2:#B8C7D5; --muted:#8797A8;
  --bg:#0E1822; --surface:#17222E; --sunk:#131D28; --line:#2B3B4B; --line-soft:#22303E;
  --accent:#45B8CE; --accent-soft:#0F2F39; --accent-line:#235A6B;
  --s1:#7FA6C9; --s2:#2AA7C0; --s3:#FF0068;
  --good:#71DA9F; --good-soft:#103526; --warn:#F2B35E; --warn-soft:#3A2A12; --crit:#FF8A80; --crit-soft:#3B1716;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -18px rgba(0,0,0,.75); color-scheme:dark }}
:root[data-theme="dark"]{
  --ink:#E9EFF5; --ink-2:#B8C7D5; --muted:#8797A8;
  --bg:#0E1822; --surface:#17222E; --sunk:#131D28; --line:#2B3B4B; --line-soft:#22303E;
  --accent:#45B8CE; --accent-soft:#0F2F39; --accent-line:#235A6B;
  --s1:#7FA6C9; --s2:#2AA7C0; --s3:#FF0068;
  --good:#71DA9F; --good-soft:#103526; --warn:#F2B35E; --warn-soft:#3A2A12; --crit:#FF8A80; --crit-soft:#3B1716;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -18px rgba(0,0,0,.75); color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:20px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:18px 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand img{height:30px;width:auto;display:block}
.brand .neg{display:none}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .brand .col{display:none} :root:not([data-theme="light"]) .brand .neg{display:block} }
:root[data-theme="dark"] .brand .col{display:none} :root[data-theme="dark"] .brand .neg{display:block}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12.5px;color:var(--ink-2);background:var(--sunk);border-radius:99px;padding:4px 12px;white-space:nowrap}
.pill b{color:var(--ink);font-weight:500}
.pill.demo{background:var(--warn-soft);color:var(--warn)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.6vw,32px);line-height:1.15;margin:16px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font:inherit;font-size:14px;color:var(--ink-2);background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main .wrap{padding-block:22px 60px;display:flex;flex-direction:column;gap:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-family:var(--display);font-weight:400;font-size:18px;margin:0 0 2px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.big{font-family:var(--display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--muted);font-family:var(--body)}
.meter{position:relative;height:10px;background:var(--sunk);border-radius:99px;margin:12px 0 6px;overflow:visible}
.meter i{display:block;height:100%;border-radius:99px}
.meter .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);border-radius:1px}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.row b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:99px;padding:3px 10px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.ok{color:var(--good);background:var(--good-soft)} .warn{color:var(--warn);background:var(--warn-soft)} .crit{color:var(--crit);background:var(--crit-soft)}
.neutral{color:var(--ink-2);background:var(--sunk)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar2{display:flex;flex-direction:column;gap:3px;min-width:120px}
.bar2 span{display:block;height:6px;border-radius:0 4px 4px 0;min-width:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg text{fill:var(--muted);font-family:var(--body);font-size:12px}
.btn{font:inherit;font-size:13.5px;font-weight:500;border-radius:9px;padding:7px 13px;cursor:pointer;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:hover{filter:brightness(1.05)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:5px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.kpi3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:560px){.kpi3{grid-template-columns:1fr}}
.kpi3 div{background:var(--sunk);border-radius:10px;padding:12px}
.kpi3 .v{font-family:var(--display);font-size:26px;line-height:1.1}
.kpi3 .l{font-size:12.5px;color:var(--muted)}
form.cuali{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:820px){form.cuali{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
label.f input,label.f select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
label.f input:focus,label.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;box-shadow:var(--shadow);color:var(--ink)}
.note{font-size:12.5px;color:var(--muted)}
.viewswitch{display:flex;gap:4px;background:var(--sunk);border-radius:99px;padding:3px}
.viewswitch button{font:inherit;font-size:12.5px;border:0;background:none;color:var(--ink-2);border-radius:99px;padding:4px 11px;cursor:pointer}
.viewswitch button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.banner{border-radius:12px;padding:12px 16px;font-size:14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--ink)} .banner.warn b{color:var(--warn)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.mini{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mini input{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);color:var(--ink);min-width:0;width:200px}
.mini input[type=date]{width:150px}
.hb{display:grid;grid-template-columns:minmax(80px,1.1fr) 2fr 44px;gap:8px;align-items:center;font-size:13.5px;margin:4px 0}
.hb .meter{margin:0}.hb b{text-align:right;font-weight:500}
.toolbar .btn{white-space:normal;text-align:left}
.btn.sm{font-size:12.5px;padding:5px 10px}
.btn.ghost{background:none;border-color:var(--line);color:var(--ink-2)}
code.link{font-size:12px;word-break:break-all;color:var(--ink-2)}
.meter.dual{display:flex;overflow:hidden}
.meter.dual i{border-radius:0}

/* Banda de marca CliO: azul noche con logotipo en negativo y acento verde */
header.top{background:var(--clio-azul);border-bottom:4px solid var(--clio-teal);color:#fff}
header.top .brand .col{display:none!important} header.top .brand .neg{display:block!important}
header.top h1{color:#fff} header.top .sub{color:rgba(255,255,255,.78)}
header.top .pill{background:rgba(255,255,255,.12);color:rgba(255,255,255,.85)} header.top .pill b{color:#fff}
header.top .pill.demo{background:var(--clio-magenta);color:#fff}
header.top nav.tabs button{color:rgba(255,255,255,.75)}
header.top nav.tabs button[aria-selected="true"]{color:#fff;border-bottom:3px solid var(--clio-verde)}
header.top nav.tabs button:focus-visible{outline-color:var(--clio-verde)}
header.top .viewswitch{background:rgba(255,255,255,.12)} header.top .viewswitch button{color:rgba(255,255,255,.8)}
header.top .viewswitch button[aria-pressed="true"]{background:#fff;color:var(--clio-azul)}
.card h2{color:var(--ink)} .card{border-top:3px solid var(--clio-teal)}
.eyebrow{color:var(--clio-teal)}
th{color:#fff;background:var(--clio-azul);border-bottom:0} th:first-child{border-top-left-radius:6px} th:last-child{border-top-right-radius:6px}
tbody tr:nth-child(even) td{background:rgba(243,248,232,.6)}
.btn.primary{background:var(--clio-azul);border-color:var(--clio-azul);color:#fff}
.kpi3 div{border-left:4px solid var(--clio-verde);border-radius:0 10px 10px 0}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) th{background:#22384F} :root:not([data-theme="light"]) tbody tr:nth-child(even) td{background:rgba(255,255,255,.03)} :root:not([data-theme="light"]) .btn.primary{background:var(--accent);border-color:var(--accent);color:#0E1822}}
:root[data-theme="dark"] th{background:#22384F} :root[data-theme="dark"] tbody tr:nth-child(even) td{background:rgba(255,255,255,.03)} :root[data-theme="dark"] .btn.primary{background:var(--accent);border-color:var(--accent);color:#0E1822}

/* v4: lectura simple, plegables, bandeja por etapas, tabla de gestión y ventana emergente */
.lectura{margin:0;font-size:13.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--clio-teal);border-radius:0 10px 10px 0;padding:10px 14px}
header.top .pill{white-space:normal;max-width:100%}
.meta{min-width:0;max-width:100%}
.card.tres .quien{margin:2px 0 10px;font-size:13px;color:var(--muted)}
.card.tres .frase{margin:10px 0 10px;font-size:14px;line-height:1.45}
details.fold{padding:0}
details.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .st{display:block;font-family:var(--display);font-weight:400;font-size:17px;color:var(--ink)}
details.fold>summary .chev{font-size:22px;color:var(--clio-teal);transition:transform .2s}
details.fold[open]>summary .chev{transform:rotate(90deg)}
details.fold>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
.fold-b{padding:0 20px 18px}
.h3{font-family:var(--display);font-weight:400;font-size:15px;margin:4px 0 10px;color:var(--clio-teal)}
.cardhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.viewswitch.light{background:var(--sunk)}
.pasos{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin-top:6px}
.paso{font:inherit;display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:140px;flex:1}
.paso b{display:block;font-weight:500;font-size:13.5px}
.paso .pn{width:24px;height:24px;border-radius:50%;background:var(--sunk);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;flex:none}
.paso[aria-pressed="true"]{border-color:var(--clio-azul);box-shadow:inset 0 -3px 0 var(--clio-verde)}
.paso[aria-pressed="true"] .pn{background:var(--clio-azul);color:#fff}
.flecha{align-self:center;color:var(--muted)}
@media(max-width:820px){.flecha{display:none}.paso{min-width:calc(50% - 6px)}}
.masa{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-radius:10px;background:var(--sunk);margin:10px 0 12px;font-size:13.5px}
.masa.on{background:var(--accent-soft);outline:1px solid var(--accent-line)}
th.ck,td.ck{width:34px;text-align:center}
.link-caso{font:inherit;font-weight:600;background:none;border:0;padding:0;color:var(--clio-teal);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
tr.clic{cursor:pointer} tr.clic:hover td{background:var(--accent-soft)!important}
.filtros{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end;margin-bottom:12px}
table.densa{font-size:12.5px} table.densa td,table.densa th{padding:7px 8px}
button.sort{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-transform:inherit;letter-spacing:inherit;white-space:nowrap}
dialog#modal{border:0;border-radius:14px;padding:0;width:min(720px,calc(100% - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(30,47,66,.55)}
dialog#modal::backdrop{background:rgba(30,47,66,.55)}
#modal-b{padding:22px 24px 24px;overflow:auto;max-height:calc(100vh - 40px)}
dialog#modal .x{position:absolute;top:10px;right:12px;font-size:22px;line-height:1;border:0;background:none;color:var(--muted);cursor:pointer;padding:6px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:3px solid var(--clio-teal);padding-bottom:10px;margin-bottom:14px;padding-right:28px}
.mhead h2{margin:2px 0 0;font-family:var(--display);font-weight:400;font-size:22px}
dl.datos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 16px;margin:0}
dl.datos dt{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)} dl.datos dd{margin:2px 0 0;font-size:14px}
ul.hist{margin:0;padding-left:18px;font-size:13px;line-height:1.75}
.link-caso,table.densa td{white-space:nowrap}
main a:not(.btn),#modal a:not(.btn){color:var(--clio-teal)}
.bloque{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.bloque .h3{margin-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

// ---------------- CARGA ----------------
function cargar(){
  if(MODO==='publico'){
    if(!ENDPOINT){ var d0=demo(); state.data={modo:'publico',ultima:d0.ultima,agg:d0.agg}; state.ficticio=true; render(); return; }
    fetch(ENDPOINT,{redirect:'follow'}).then(function(r){if(!r.ok)throw new Error('El servidor respondió '+r.status);return r.json();})
      .then(function(d){if(d.error)throw new Error(d.error);state.data=d;render();})
      .catch(function(e){document.getElementById('app').innerHTML='<div class="card"><h2>No se pudieron cargar las cifras</h2><p class="hint">'+esc(e.message)+'. Intente de nuevo en unos minutos.</p></div>';});
    return;
  }
  if(!hasGAS){ state.data=demo(); state.ficticio=true; render(); return; }
  google.script.run.withSuccessHandler(function(d){state.data=d;render();})
    .withFailureHandler(function(e){document.getElementById('app').innerHTML='<div class="card"><h2>No se pudo cargar</h2><p class="hint">'+esc(e.message)+'</p></div>';})
    .getData(MODO, TOKEN);
}
function call(fn,args,ok){
  if(!hasGAS){toast('En la maqueta los botones no ejecutan acciones.');return;}
  var r=google.script.run.withSuccessHandler(function(m){toast(typeof m==='string'?m:'Listo.');if(ok)ok(m);})
    .withFailureHandler(function(e){toast(e.message);});
  r[fn].apply(r,args||[]);
}

function render(){
  var d=state.data, cliente = state.vista==='cliente';
  var ab=(d.deriv||[]).filter(function(k){return ABIERTOS.indexOf(k.estado)>=0;}).length;
  var tabs = MODO==='publico' ? [['resumen','Resumen']]
    : (cliente ? [['resumen','Resumen'],['indic','Indicadores preliminares']]
    : [['resumen','Resumen'],['bbdd','Con base de datos'],['deriv','Derivaciones'],['difusion','Sin base · difusión'],['cuali','Cualitativo'],['indic','Indicadores']]);
  if(!tabs.some(function(t){return t[0]===state.tab;})) state.tab='resumen';
  document.getElementById('tabs').innerHTML = tabs.map(function(t){
    var chip = t[0]==='deriv' ? ' <span class="chip '+(d.agg.deriv.vencidas>0?'crit':'neutral')+'">'+ab+'</span>' : '';
    return '<button role="tab" id="tab-'+t[0]+'" aria-selected="'+(state.tab===t[0])+'" data-tab="'+t[0]+'">'+t[1]+chip+'</button>';
  }).join('');

    '<div class="viewswitch" role="group" aria-label="Vista"><button aria-pressed="'+(!cliente)+'" data-vista="interno">Vista CliO</button><button aria-pressed="'+cliente+'" data-vista="cliente">Vista cliente</button></div>';

  document.getElementById('meta').innerHTML=m;

  var app=document.getElementById('app');

    difusion:function(){return vDifusion(d);},cuali:function(){return vCuali(d);},indic:function(){return vIndic(d.agg,cliente);}};
  app.innerHTML=V[state.tab]();

  return '<span class="chip crit">Bajo el umbral: activar medidas</span>'; }

function lineChart(serie){
  var W=1000,H=280,L=44,R=70,Tp=16,B=32, sMax=Math.max(9,serie[serie.length-1].s), sMin=5;
  var x=function(s){return L+(s-sMin)/(sMax-sMin)*(W-L-R);}, y=function(v){return Tp+(1-v/100)*(H-Tp-B);};
  var g='';
  [0,25,50,75,100].forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line-soft)"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'%</text>';});
  for(var s=sMin;s<=sMax;s++) g+='<text x="'+x(s)+'" y="'+(H-10)+'" text-anchor="middle">S'+s+'</text>';
  [[6,25],[7,50],[8,80],[9,100]].forEach(function(c){g+='<rect x="'+(x(c[0])-3)+'" y="'+(y(c[1])-1)+'" width="6" height="2" fill="var(--ink-2)"/>';});
  var series=[['T',700,'var(--s1)','Usuarios'],['C',600,'var(--s2)','Comparación']], lines='';
  series.forEach(function(sr){
    var pts=serie.map(function(p){return [x(p.s),y(Math.min(100,100*p[sr[0]]/sr[1])),p];});
    lines+='<polyline fill="none" stroke="'+sr[2]+'" stroke-width="2" stroke-linejoin="round" points="'+pts.map(function(p){return p[0]+','+p[1];}).join(' ')+'"/>';
    pts.forEach(function(p,i){ var last=i===pts.length-1;
      lines+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(last?5:3.5)+'" fill="'+sr[2]+'" stroke="var(--surface)" stroke-width="2" data-tip="'+sr[3]+' · S'+p[2].s+': '+p[2][sr[0]]+' encuestas ('+Math.round(100*p[2][sr[0]]/sr[1])+'% de '+sr[1]+')"/>';
      if(last) lines+='<text x="'+(p[0]+9)+'" y="'+(p[1]+4)+'" style="fill:var(--ink);font-weight:500">'+Math.round(100*p[2][sr[0]]/sr[1])+'%</text>';
    });
  });
  return '<div class="tw"><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Avance acumulado por semana, en porcentaje de la meta">'+g+lines+'</svg></div>';
}

  var L={celular:'Celular propio limitado',datos:'Costo de datos o señal',app:'Dificultad con la app',requisitos:'Papeles o requisitos',tiempo:'Falta de tiempo',desconfianza:'Desconfianza',atencion:'Poca atención de la startup',lectura:'Dificultad para leer',costo:'Costo del servicio',
    seg_medico:'Seguro médico',seg_accidentes:'Seguro de accidentes',seg_vehiculo:'Seguro de vehículo',seg_terceros:'Seguro por daños a terceros',capacitacion:'Capacitación',legal:'Representación legal',contabilidad:'Contabilidad',credito:'Crédito',ahorro:'Ahorro',pagos:'Pagos electrónicos',asesoria:'Asesoría para el negocio'};
  var CAMB={mejoro:'Mejoró',igual:'Sigue igual',empeoro:'Empeoró'};
  var sat=I.satisfaccion, s45=(typeof sat.cats['4']==='number'&&typeof sat.cats['5']==='number'&&sat.base)?Math.round(100*(sat.cats['4']+sat.cats['5'])/sat.base):null;
  var rec=I.recomienda, pr=(typeof rec.cats.si==='number'&&rec.base)?Math.round(100*rec.cats.si/rec.base):null;
  var h='<div class="banner warn"><b>Resultados preliminares.</b> Se calculan con las encuestas completas hasta hoy, sin ponderar y con el campo abierto. Sirven para monitorear; no son hallazgos de la evaluación'+(cliente?'':' y no deben citarse fuera del equipo')+'.</div>';
  h+='<div class="grid g2"><div class="card"><div class="eyebrow">Usuarios · satisfacción con el servicio</div><div class="big mono">'+(s45===null?'—':s45+'%')+' <small>satisfechos o muy satisfechos</small></div><p class="note">Base: '+num(sat.base)+' usuarios (pregunta m5_01).</p></div>'+
    '<div class="card"><div class="eyebrow">Usuarios · recomendarían la solución</div><div class="big mono">'+(pr===null?'—':pr+'%')+' <small>dicen que sí</small></div><p class="note">Base: '+num(rec.base)+' usuarios (pregunta m5_04).</p></div></div>';
  h+='<div class="card"><h2>Cambios percibidos desde que usa el servicio</h2><p class="hint">Solo usuarios (pregunta m5_03). Es la percepción declarada, no una medición del efecto.</p><div class="grid g3">'+
    [['Ingresos','cambio_ingresos'],['Protección (salud, seguros, ahorro)','cambio_proteccion'],['Trabajo (clientes, condiciones)','cambio_trabajo']].map(function(x){
      return '<div><div class="eyebrow">'+x[0]+'</div>'+barras(I[x[1]],CAMB,'var(--s1)',I[x[1]].base,cliente)+'<p class="note">Base: '+num(I[x[1]].base)+'</p></div>';}).join('')+'</div></div>';
  h+='<div class="grid g2"><div class="card"><h2>Barrera principal</h2><p class="hint">Todas las personas (pregunta m3_02). Las cinco más mencionadas.</p>'+barras(I.barrera,top(I.barrera,5),'var(--s2)',I.barrera.base,cliente)+'<p class="note">Base: '+num(I.barrera.base)+'</p></div>'+
    '<div class="card"><h2>Piensa adquirir en los próximos 12 meses</h2><p class="hint">Todas las personas (pregunta m6_01, respuesta múltiple). Los cinco más mencionados.</p>'+barras(I.intencion,top(I.intencion,5),'var(--s3)',I.intencion.base,cliente)+'<p class="note">Base: '+num(I.intencion.base)+'</p></div></div>';
  return h;
}

// ---------------- EVENTOS ----------------
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-vista],[data-filtro],[data-vistab],[data-etapa],[data-seg1],[data-segm],[data-limpiar],[data-caso],[data-orden],[data-fblimpiar],[data-csv],[data-fagenda],[data-fcupo],[data-cupo],[data-app],[data-agendar],[data-act-cuali],[data-doc],[data-copiar],[data-cerrar],#btn-sync'); if(!t)return;
  var ds=t.dataset;
  if(ds.tab){state.tab=ds.tab;render();}
  else if(ds.vista){state.vista=ds.vista;render();}
  else if(ds.filtro){state.filtro=ds.filtro;render();}
  else if(ds.vistab){state.vistaB=ds.vistab;render();}
  else if(ds.etapa){state.etapa=ds.etapa;state.vistaB='bandeja';state.sel={};render();}
  else if(ds.seg1){call('registrarSeguimiento',[[ds.id],ds.seg1,''],function(){cerrarModal();cargar();});}
  else if(ds.segm){var ids=Object.keys(state.sel).filter(function(k){return state.sel[k];}); if(!ids.length)return;
    call('registrarSeguimiento',[ids,ds.segm,''],function(){state.sel={};cargar();});}
  else if(ds.limpiar){state.sel={};render();}
  else if(ds.orden){state.orden={k:ds.orden,dir:state.orden.k===ds.orden?-state.orden.dir:1};render();}
  else if(ds.fblimpiar){state.fb={};render();}
  else if(ds.csv){csvVisible();}
  else if(ds.fagenda){state.fAgenda=ds.fagenda;render();}
  else if(ds.fcupo!==undefined){state.fCupo=ds.fcupo;render();}
  else if(ds.caso){state.modal={t:'caso',id:ds.caso};abrirModal(fichaCaso(state.data,ds.caso));}
  else if(ds.app){state.modal={t:'app',id:ds.app};abrirModal(fichaApp(state.data,ds.app));}
  else if(ds.cupo){var a=(state.data.cuali.apps||[]).filter(function(x){return x.id_cupo===ds.cupo&&x.estado!=='cancelada';})[0];
    if(a){state.modal={t:'app',id:a.id_app};abrirModal(fichaApp(state.data,a.id_app));} else {state.modal={t:'cupo',id:ds.cupo};abrirModal(fichaCupo(state.data,ds.cupo));}}
  else if(ds.agendar){if(!val('ci-fecha')){toast('Elija la fecha.');return;}
    call('agendarCuali',[{id_cupo:ds.agendar,tipo_informante:val('ci-tipo'),fecha:val('ci-fecha'),modalidad:val('ci-mod'),responsable:val('ci-resp')}],function(){cerrarModal();cargar();});}
  else if(ds.actCuali){var ac=ds.actCuali, v=ac==='reagendar'?val('cu-fecha'):(ac==='cancelar'?val('cu-motivo'):(ac==='transcripcion'?val('cu-link').trim():''));
    if((ac==='reagendar'||ac==='cancelar'||ac==='transcripcion')&&!v){toast(ac==='reagendar'?'Elija la nueva fecha.':(ac==='cancelar'?'Escriba el motivo.':'Pegue el enlace.'));return;}
    call('actualizarCuali',[ds.id,ac,v],function(){cerrarModal();cargar();});}
  else if(ds.doc){ if(!hasGAS){toast('En la maqueta los botones no ejecutan acciones.');return;}
    var w=window.open('about:blank','_blank'); toast('Preparando el documento de notas…');
    google.script.run.withSuccessHandler(function(url){if(w)w.location=url;cargar();}).withFailureHandler(function(err){if(w)w.close();toast(err.message);}).docNotasCuali(ds.doc);}
  else if(ds.copiar){ (navigator.clipboard?navigator.clipboard.writeText(ds.copiar):Promise.reject()).then(function(){toast('Enlace copiado.');},function(){toast('No se pudo copiar: selecciónelo a mano.');}); }
  else if(ds.cerrar){cerrarModal();}
  else if(t.id==='btn-sync'){toast('Sincronizando con Kobo…');call('sincronizar',[],function(){cargar();});}
});
document.addEventListener('change',function(e){var t=e.target, ds=t.dataset||{};
  if(ds.sel!==undefined){state.sel[ds.sel]=t.checked;render();}
  else if(ds.selpag){document.querySelectorAll('[data-sel]').forEach(function(c){state.sel[c.dataset.sel]=t.checked;});render();}
  else if(ds.fb){state.fb[ds.fb]=t.value;render();}
});
document.addEventListener('input',function(e){var t=e.target; if(t.dataset&&t.dataset.fb==='q'){state.fb.q=t.value;clearTimeout(window.__qt);window.__qt=setTimeout(function(){render();var i=document.querySelector('[data-fb="q"]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},250);}});
document.addEventListener('toggle',function(e){var t=e.target; if(t.dataset&&t.dataset.pleg)state.plegados[t.dataset.pleg]=t.open;},true);
document.addEventListener('keydown',function(e){if(e.key==='Enter'){var tr=e.target.closest&&e.target.closest('tr.clic');if(tr)tr.click();}});

function val(id){return document.getElementById(id).value;}
function bindTips(){
  var tip=document.getElementById('tip');
  document.querySelectorAll('[data-tip]').forEach(function(el){
    el.addEventListener('mouseenter',function(){tip.textContent=el.getAttribute('data-tip');tip.hidden=false;});
    el.addEventListener('mousemove',function(ev){tip.style.left=Math.min(ev.clientX+12,window.innerWidth-240)+'px';tip.style.top=(ev.clientY+12)+'px';});
    el.addEventListener('mouseleave',function(){tip.hidden=true;});
  });
}
cargar();
})();
</script>
